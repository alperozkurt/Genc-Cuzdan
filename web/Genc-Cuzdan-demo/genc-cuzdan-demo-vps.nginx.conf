.##
##  Genç Cüzdan Demo — Nginx Server Block (VPS / Direct Hosting)
##  Requires: certbot + python3-certbot-nginx  (Let's Encrypt TLS)
##
##  Replace every occurrence of "demo.genc-cuzdan.com" with your actual domain.
##
##  Steps:
##    1. Place this file in /etc/nginx/sites-available/genc-cuzdan-demo
##    2. ln -s /etc/nginx/sites-available/genc-cuzdan-demo /etc/nginx/sites-enabled/
##    3. nginx -t && systemctl reload nginx
##    4. certbot --nginx -d demo.genc-cuzdan.com
##    (Certbot will automatically edit this file to add the SSL block below)
##

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name demo.genc-cuzdan.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — main server block ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                           # Enable HTTP/2 (nginx ≥ 1.25.1 syntax)
    server_name demo.genc-cuzdan.com;

    # ── TLS — filled in by certbot; paths shown for reference ────────────────
    ssl_certificate     /etc/letsencrypt/live/demo.genc-cuzdan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.genc-cuzdan.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Modern TLS hardening (A+ on SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Document Root ─────────────────────────────────────────────────────────
    root /mnt/Extra/Genc-Cuzdan/web/Genc-Cuzdan-demo;
    index index.html;
    charset utf-8;

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/genc-cuzdan-demo.access.log;
    error_log  /var/log/nginx/genc-cuzdan-demo.error.log warn;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header X-XSS-Protection          "1; mode=block"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Content-Security-Policy:
    #   'self'                 → HTML / CSS / JS from this origin
    #   fonts.googleapis.com   → Google Fonts CSS import in styles.css
    #   fonts.gstatic.com      → Google Fonts woff2 files
    #   cdn.jsdelivr.net       → canvas-confetti CDN (index.html line 14)
    #   open.er-api.com        → live exchange-rate fetch in app.js initLiveRates()
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src  'self' https://cdn.jsdelivr.net; \
         style-src   'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src    'self' https://fonts.gstatic.com; \
         img-src     'self' data:; \
         connect-src 'self' https://open.er-api.com; \
         frame-ancestors 'none';"
        always;

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Static Assets — long cache ────────────────────────────────────────────
    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── CSS / JS — short cache ────────────────────────────────────────────────
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Main entry-point — never cache ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Deny hidden files ─────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
